name: 5-Minute Wedding Countdown Push Notification

on:
  schedule:
    # Runs every 5 minutes for sharp testing
    - cron: '*/5 * * * *'
  workflow_dispatch: # Allows manual 1-click trigger from GitHub Actions UI anytime!

concurrency:
  group: 'push-notifications'
  cancel-in-progress: false

jobs:
  dispatch-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Firebase Admin
        run: npm install firebase-admin --legacy-peer-deps --no-audit --no-fund

      - name: Send Wedding Countdown Push Notification Every 1 Minute
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          for i in $(seq 1 15); do
            echo "🔔 Minute $i: Sending push notification..."
            node scripts/send-push.js
            if [ $i -lt 15 ]; then
              echo "⏳ Waiting 60 seconds for the next 1-minute notification..."
              sleep 60
            fi
          done
