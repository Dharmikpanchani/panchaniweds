name: Daily Wedding Countdown Push Notification

on:
  schedule:
    # Runs every day at 07:00 AM IST (01:30 AM UTC)
    - cron: '30 1 * * *'
  workflow_dispatch: # Allows manual 1-click trigger from GitHub Actions UI anytime!

concurrency:
  group: 'push-notifications'
  cancel-in-progress: false

jobs:
  dispatch-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Firebase Admin
        run: npm install firebase-admin --legacy-peer-deps --no-audit --no-fund

      - name: Send Daily Wedding Countdown Push Notification
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: node scripts/send-push.js
