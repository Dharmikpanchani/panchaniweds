<svg xmlns="http://www.w3.org/2000/svg" width="40" height="48" viewBox="0 0 40 48" fill="none">
  <defs>
    <radialGradient id="redPetalGrad" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#ff4d6d"/>
      <stop offset="45%" stop-color="#c9184a"/>
      <stop offset="80%" stop-color="#800f2f"/>
      <stop offset="100%" stop-color="#590d22"/>
    </radialGradient>
    <linearGradient id="petalSheen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.35"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#30000a" stop-opacity="0.3"/>
    </linearGradient>
    <filter id="petalSoftShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="1" dy="2" stdDeviation="1.5" flood-color="#30000a" flood-opacity="0.35"/>
    </filter>
  </defs>
  <!-- Natural curved rose petal body -->
  <path d="M20 44 C12 38, 3 28, 4 16 C5 6, 14 2, 20 5 C26 2, 35 6, 36 16 C37 28, 28 38, 20 44 Z" fill="url(#redPetalGrad)" filter="url(#petalSoftShadow)"/>
  <!-- Velvety highlight overlay -->
  <path d="M20 44 C12 38, 3 28, 4 16 C5 6, 14 2, 20 5 C26 2, 35 6, 36 16 C37 28, 28 38, 20 44 Z" fill="url(#petalSheen)"/>
  <!-- Petal vein detail -->
  <path d="M20 42 C19 28, 18 16, 20 7" stroke="#ff758f" stroke-width="0.8" opacity="0.4" stroke-linecap="round"/>
</svg>
