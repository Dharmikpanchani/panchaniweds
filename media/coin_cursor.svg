<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32">
  <defs>
    <radialGradient id="goldCoin" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#fff8cc"/>
      <stop offset="35%" stop-color="#ffd700"/>
      <stop offset="70%" stop-color="#d4af37"/>
      <stop offset="100%" stop-color="#8c6d1f"/>
    </radialGradient>
    <radialGradient id="innerCoin" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#ffeaa7"/>
      <stop offset="60%" stop-color="#e1b12c"/>
      <stop offset="100%" stop-color="#996515"/>
    </radialGradient>
    <filter id="coinShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="1" dy="2" stdDeviation="1.5" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
  </defs>
  <!-- Coin outer circle with shadow -->
  <circle cx="15" cy="15" r="13" fill="url(#goldCoin)" stroke="#785310" stroke-width="1.2" filter="url(#coinShadow)"/>
  <!-- Beaded milling rim -->
  <circle cx="15" cy="15" r="11" fill="none" stroke="#fff8cc" stroke-width="0.8" stroke-dasharray="1.2,1.2"/>
  <!-- Inner coin plate -->
  <circle cx="15" cy="15" r="9.5" fill="url(#innerCoin)" stroke="#b8860b" stroke-width="0.7"/>
  <!-- Center auspicious star / floral engraving -->
  <path d="M15 8.5 L16.2 12.8 L20.5 12.8 L17 15.5 L18.3 19.8 L15 17.2 L11.7 19.8 L13 15.5 L9.5 12.8 L13.8 12.8 Z" fill="#fff5cc" opacity="0.85"/>
  <circle cx="15" cy="15" r="2" fill="#785310" opacity="0.6"/>
</svg>
